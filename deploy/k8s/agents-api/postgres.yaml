# Dedicated PostgreSQL 16 for the standalone Agents API execution database.
#
# Scope: an in-cluster test database, reachable only from inside the namespace
# through its ClusterIP Service. It is deliberately simple:
#   - one instance, no replication, no failover, no backups
#   - no Ingress, no NodePort, no LoadBalancer
#   - Core owns its own schema here through agents-api-migrate
#
# This must stay separate from the Parsar product database and from the sandbase
# application database: Core applies its own embedded migrations and tracks them in
# agents_api_schema_version.
#
# Durability caveat, accepted for testing: node loss, a deleted PVC or a storage
# incident loses every Session, Turn and Item. Core treats its database as the
# durable truth, so losing it is not recoverable from the browser or from E2B.
# Anything that must survive needs a managed database instead.
---
apiVersion: v1
kind: Service
metadata:
  name: agents-api-postgres
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: agents-api-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agents-api-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agents-api-postgres
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: agents-api-postgres
spec:
  serviceName: agents-api-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agents-api-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agents-api-postgres
    spec:
      securityContext:
        # The official image starts as root and drops to postgres; only the volume
        # group is forced so the data directory stays writable.
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: agents_api
            - name: POSTGRES_DB
              value: agents_api
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${POSTGRES_SECRET}
                  key: password
            # Keep the cluster in a subdirectory so a volume with lost+found or any
            # other pre-existing entry still initializes.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agents_api", "-d", "agents_api"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "agents_api", "-d", "agents_api"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        #@if STORAGE_CLASS
        storageClassName: ${STORAGE_CLASS}
        #@endif
        resources:
          requests:
            storage: ${STORAGE_SIZE}
